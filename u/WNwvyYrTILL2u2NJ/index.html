<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>United Dialog — Веб-Архив</title>
<style>
*{box-sizing:border-box}
body{background:#17212b;color:#ffffff;margin:0;padding:20px;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:800px;margin:0 auto}
h1{text-align:center;color:#64b5f6;margin-bottom:25px;font-size:22px}
.msg{background:#242f3d;border:1px solid #3e546a;border-radius:12px;
padding:15px;margin-bottom:12px;box-shadow:0 4px 6px rgba(0,0,0,.3)}
.head{display:flex;justify-content:space-between;padding-bottom:10px;
margin-bottom:10px;border-bottom:1px solid #3e546a}
.name{font-weight:700;color:#64b5f6}
.time{font-size:12px;color:#8a9bae}
.body{line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.media{display:inline-block;margin-top:10px;padding:6px 12px;
background:#3e546a;border-radius:6px;font-size:13px}
</style></head><body><div class="wrap">
<h1>United Dialog — Веб-Архив</h1>
        <div class="msg">
          <div class="head"><span class="name">дыб</span><span class="time">23.09.2026 17:04</span></div>
          <div class="body">ррр</div>
        </div>
        <div class="msg">
          <div class="head"><span class="name">Илья</span><span class="time">23.09.2026 17:22</span></div>
          <div class="body">А все она не читает видимо спит</div>
        </div>
        <div class="msg">
          <div class="head"><span class="name">Илья</span><span class="time">23.09.2026 17:22</span></div>
          <div class="body">Хахаха</div>
        </div>
        <div class="msg">
          <div class="head"><span class="name">симка</span><span class="time">23.09.2026 17:22</span></div>
          <div class="body">брат</div>
        </div>
        <div class="msg">
          <div class="head"><span class="name">симка</span><span class="time">23.09.2026 17:22</span></div>
          <div class="body">я покажу</div>
        </div>
        <div class="msg">
          <div class="head"><span class="name">симка</span><span class="time">23.09.2026 17:22</span></div>
          <div class="body">ща</div>
        </div>
        <div class="msg">
          <div class="head"><span class="name">симка</span><span class="time">23.09.2026 17:22</span></div>
          <div class="body">ахуено выходит</div>
        </div>
</div></body></html>
